name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  editorconfig:
    uses: ./.github/workflows/editorconfig.yaml

  prettier:
    uses: ./.github/workflows/prettier.yaml

  remark:
    uses: ./.github/workflows/remark.yaml

  commitlint:
    uses: ./.github/workflows/commitlint.yaml

  pre-commit:
    uses: ./.github/workflows/pre-commit.yaml

  release:
    name: Release

    needs:
      - editorconfig
      - prettier
      - remark
      - commitlint
      - pre-commit

    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build
        run: |
          VERSION="ghost-${GITHUB_SHA::7}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          git archive --format=zip --prefix="$VERSION/" \
            --output="$RUNNER_TEMP/$VERSION.zip" \
            HEAD -- .agents AGENTS.md CLAUDE.md LICENSE

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$VERSION"
          "$RUNNER_TEMP/$VERSION.zip"
          --target "$GITHUB_SHA" --generate-notes
