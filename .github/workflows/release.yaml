name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build
        run: >-
          git archive --format=zip --prefix="ghost-$GITHUB_REF_NAME/"
          --output="$RUNNER_TEMP/ghost-$GITHUB_REF_NAME.zip"
          HEAD -- '*.md' LICENSE

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/ghost-$GITHUB_REF_NAME.zip"
          --verify-tag --generate-notes
