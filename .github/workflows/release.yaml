name: Release

on:
  workflow_run:
    workflows:
      - Editorconfig
      - Prettier
      - Remark
      - Commit Lint
      - Pre Commit
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check Linters
        id: linters
        run: |
          VERSION="ghost-${COMMIT::7}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          RUNS="repos/$GITHUB_REPOSITORY/actions/runs"

          READY=$(gh api "$RUNS?head_sha=$COMMIT&event=push&per_page=100" --jq '
            .workflow_runs
            | map(select(.head_branch == "main" and .event == "push"))
            | group_by(.name) | map(max_by(.id))
            | map(select(.name as $name | [
                "Editorconfig", "Prettier", "Remark", "Commit Lint", "Pre Commit"
              ] | index($name)))
            | length == 5 and all(.conclusion == "success")
          ')

          if [ "$READY" = true ] && gh release view "$VERSION" >/dev/null 2>&1; then
            READY=false
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        if: steps.linters.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build
        if: steps.linters.outputs.ready == 'true'
        run: |
          for AGENT in codex claude cursor copilot gemini opencode; do
            NAME="ghost-$AGENT-${COMMIT::7}"
            DIRECTORY="$RUNNER_TEMP/$NAME"

            mkdir -p "$DIRECTORY"
            git archive HEAD -- .agents LICENSE |
              tar -x -C "$DIRECTORY"
            mv "$DIRECTORY/.agents/AGENTS.md" "$DIRECTORY/AGENTS.md"
            mv "$DIRECTORY/.agents/skills/README.md" "$DIRECTORY/.agents/skills.md"
            mv "$DIRECTORY/.agents/skills/passive" "$DIRECTORY/.agents/detectors"
            mv "$DIRECTORY/.agents/skills/active" "$DIRECTORY/skills"
            rmdir "$DIRECTORY/.agents/skills"

            case "$AGENT" in
              codex)
                SKILLS=".agents/skills"
                ADAPTER=""
                LOADER="AGENTS.md" ;;
              claude)
                SKILLS=".claude/skills"
                ADAPTER="CLAUDE.md"
                LOADER="CLAUDE.md" ;;
              cursor)
                SKILLS=".cursor/skills"
                ADAPTER=""
                LOADER=".cursor/rules/ghost.mdc" ;;
              copilot)
                SKILLS=".github/skills"
                ADAPTER=""
                LOADER=".github/copilot-instructions.md" ;;
              gemini)
                SKILLS=".gemini/skills"
                ADAPTER="GEMINI.md"
                LOADER="GEMINI.md" ;;
              opencode)
                SKILLS=".opencode/skills"
                ADAPTER=""
                LOADER="AGENTS.md" ;;
            esac

            mkdir -p "$DIRECTORY/$(dirname "$SKILLS")" \
              "$DIRECTORY/$(dirname "$LOADER")"
            mv "$DIRECTORY/skills" "$DIRECTORY/$SKILLS"
            if [ -n "$ADAPTER" ]; then
              mv "$DIRECTORY/.agents/$ADAPTER" "$DIRECTORY/$LOADER"
            elif [ "$AGENT" = cursor ]; then
              cat > "$DIRECTORY/$LOADER" <<'CURSOR'
          ---
          description: GHOST engineering guidance and skill routing
          alwaysApply: true
          ---

          Read `AGENTS.md` before substantive work. Apply its relevant rule files
          and invoke matching procedures from the native skills catalog. Keep
          passive detectors on demand. State missing discovery instead of claiming
          that a manual file read produced a native skill activation.
          CURSOR
            elif [ "$AGENT" = copilot ]; then
              cat > "$DIRECTORY/$LOADER" <<'COPILOT'
          # GHOST Copilot adapter

          Read `AGENTS.md` before substantive work. Apply its relevant rules and
          use matching procedures from `.github/skills/`. Keep passive detectors
          on demand. Report the selected skills and verification evidence;
          discovery or a successful formatter run does not establish compliance.
          COPILOT
            fi

            rm -f "$DIRECTORY/.agents/CLAUDE.md" "$DIRECTORY/.agents/GEMINI.md"

            if [ "$AGENT" != codex ]; then
              find "$DIRECTORY/$SKILLS" -name openai.yaml -delete
              find "$DIRECTORY/$SKILLS" -type d -empty -delete
            fi

            find "$DIRECTORY" -type f \( -name '*.md' -o -name '*.mdc' \) \
              ! -name runtime-adapters-and-context-budget.md -exec \
              sed -i.bak \
                -e "s|.agents/skills/active/|$SKILLS/|g" \
                -e 's|.agents/skills/passive/|.agents/detectors/|g' \
                -e 's|.agents/skills/README.md|.agents/skills.md|g' \
                -e "s|\.agents/skills/|$SKILLS/|g" \
                -e "s|\.agents/skills\([^./a-zA-Z0-9_-]\)|$SKILLS\1|g" \
                -e "s|\.agents/skills$|$SKILLS|g" \
                -e 's|skills/active/|skills/|g'  \
                -e 's|skills/passive/|detectors/|g' {} +

            find "$DIRECTORY" -name '*.bak' -delete

            (cd "$RUNNER_TEMP" && zip -qr "$NAME.zip" "$NAME")
          done

      - name: Create Release
        if: steps.linters.outputs.ready == 'true'
        run: >-
          gh release create "$VERSION" "$RUNNER_TEMP"/ghost-*-${COMMIT::7}.zip
          --target "$COMMIT" --generate-notes
